  <!-- Global Error Handler — evita tela branca no APK -->
  <script>
    window.__smartgestor_errors = [];
    window.onerror = function(msg, src, line, col, err) {
      console.error('❌ [GLOBAL ERROR]', msg, src, line, col, err);
      window.__smartgestor_errors.push({msg, src, line, col, stack: err && err.stack});
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      console.error('❌ [UNHANDLED PROMISE]', e.reason);
      window.__smartgestor_errors.push({msg: 'UnhandledRejection', stack: e.reason && e.reason.stack});
    });
    // Timeout de emergência — se depois de 8s o #app estiver vazio, mostra diagnóstico
    setTimeout(function() {
      var app = document.getElementById('app');
      if (app && (!app.innerHTML || app.innerHTML.trim().length < 10)) {
        var errs = window.__smartgestor_errors;
        var html = '<div style="padding:24px;font-family:sans-serif;max-width:500px;margin:40px auto;">';
        html += '<h2 style="color:#E53E3E;">⚠️ Erro na inicialização</h2>';
        html += '<p style="color:#555;">O app não conseguiu inicializar. Erros detectados:</p>';
        if (errs.length > 0) {
          html += '<pre style="background:#F7FAFC;padding:12px;border-radius:8px;overflow:auto;font-size:12px;max-height:300px;">';
          errs.forEach(function(e) {
            html += (e.msg || 'Unknown') + '\n' + (e.src || '') + ':' + (e.line || '') + '\n' + (e.stack || '') + '\n---\n';
          });
          html += '</pre>';
        } else {
          html += '<p style="color:#888;">Nenhum erro JS capturado. Possível timeout de rede nos CDNs.</p>';
        }
        html += '<button onclick="location.reload()" style="margin-top:16px;padding:10px 20px;background:#1E4BFF;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">Tentar novamente</button>';
        html += '</div>';
        app.innerHTML = html;
      }
    }, 8000);
  </script>

    <button onclick="window.__applyUpdate()" style="

  <style>

      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>

  <script>
    // ─── Service Worker: Update-First Strategy ───────────────────────────────
    if ('serviceWorker' in navigator) {
      let newWorker = null;

      // Mostra o banner de atualização
      function showUpdateBanner() {
        const banner = document.getElementById('pwa-update-banner');
        if (banner) {
          banner.style.display = 'flex';
          // Auto-aplica após 10 segundos sem interação
          setTimeout(() => { if (newWorker) window.__applyUpdate(); }, 10000);
        }
      }

      // Aplica a atualização imediatamente
      window.__applyUpdate = function() {
        if (newWorker) {
          newWorker.postMessage({ type: 'SKIP_WAITING' });
        } else {
          window.location.reload();
        }
      };

      // Força limpeza total do cache e reload
      window.__forceUpdate = function() {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
        }
        // Limpa todos os caches via CacheStorage API
        if ('caches' in window) {
          caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))));
        }
        setTimeout(() => window.location.reload(true), 500);
      };

      navigator.serviceWorker.register('/sw.js').then((reg) => {
        console.log('✅ SW registrado. Scope:', reg.scope);

        // Verifica atualização imediatamente
        reg.update();

        // Verifica a cada 5 minutos
        setInterval(() => reg.update(), 5 * 60 * 1000);

        // Verifica atualização imediatamente quando o app volta ao primeiro plano
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            console.log('👀 App em foco. Checando atualização em background...');
            reg.update();
          }
        });

        // Detecta quando uma nova versão está sendo instalada
        reg.addEventListener('updatefound', () => {
          const installing = reg.installing;
          console.log('📥 Nova versão do SW encontrada — instalando...');

          installing.addEventListener('statechange', () => {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              // Há um SW antigo ativo — novo está pronto
              console.log('✨ Nova versão instalada e pronta!');
              newWorker = installing;
              showUpdateBanner();
            }
            if (installing.state === 'activated' && !navigator.serviceWorker.controller) {
              // Primeira instalação — já está ativo
              console.log('🎉 PWA instalado pela primeira vez!');
            }
          });
        });

        // Se já há um SW esperando (ex: reload com nova versão pendente)
        if (reg.waiting) {
          console.log('⏳ SW atualizado aguardando ativação');
          newWorker = reg.waiting;
          showUpdateBanner();
        }

      }).catch((err) => {
        console.error('❌ Falha ao registrar SW:', err);
      });

      // Quando o SW toma controle: recarrega a página automaticamente
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('🔄 Novo SW ativo — recarregando...');
        window.location.reload();
      });
    }
  </script>
